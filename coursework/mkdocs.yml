site_name: Рони Каасамани
site_description: Персональный сайт — курсовая работа по курсу «Введение в веб-технологии», ИТМО, группа U4225
site_author: Каасамани Рони Бахааевич
copyright: Copyright &copy; 2026 Рони Каасамани · Курсовая работа, ИТМО U4225

theme:
  name: material
  language: ru
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Контакты: contacts.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: На этой странице

plugins:
  - search:
      lang: ru

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:rroommaa2003@gmail.com
      name: Email
